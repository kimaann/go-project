{{define "layout"}}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Kopiku — Kedai kopi premium dengan cabang di seluruh Indonesia. Nikmati kopi terbaik, promo menarik, dan sistem poin eksklusif.">
    <title>Kopiku — {{.Title}}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --espresso:   #1A0A00;
            --dark-roast: #2C1A0E;
            --medium:     #5C3317;
            --latte:      #8B5E3C;
            --caramel:    #C4862A;
            --cream:      #F5E6D0;
            --milk:       #FDF6EE;
            --white:      #FFFFFF;
            --text-dark:  #1A0A00;
            --text-muted: #7a6352;
            --shadow:     0 4px 24px rgba(44,26,14,0.12);
            --shadow-lg:  0 12px 48px rgba(44,26,14,0.18);
            --radius:     14px;
            --nav-w:      240px;
        }
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
        html, body { height: 100%; }

        body {
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            line-height: 1.65;
            color: var(--text-dark);
            background: var(--milk);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        a { color: var(--caramel); text-decoration: none; }
        a:hover { text-decoration: underline; }

        /* ===== Header ===== */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            height: 68px;
            padding: 0 32px;
            background: var(--espresso);
            border-bottom: 2px solid var(--caramel);
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 20px rgba(0,0,0,0.4);
        }

        /* ===== Layout: sidebar + main ===== */
        .page-body {
            display: flex;
            flex: 1;
        }

        /* ===== Sidebar ===== */
        nav.sidebar {
            width: var(--nav-w);
            background: var(--dark-roast);
            padding: 32px 0;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 68px;
            height: calc(100vh - 68px);
            overflow-y: auto;
        }

        /* ===== Main Content ===== */
        main {
            flex: 1;
            padding: 40px 48px;
            min-height: calc(100vh - 68px - 56px);
        }

        /* ===== Footer ===== */
        footer {
            background: var(--espresso);
            color: rgba(245,230,208,0.6);
            font-size: 13px;
            text-align: center;
            padding: 16px 32px;
            border-top: 1px solid rgba(196,134,42,0.3);
        }

        /* ===== Buttons ===== */
        .btn {
            display: inline-block;
            padding: 10px 22px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            border: none;
            transition: all .2s ease;
            letter-spacing: 0.3px;
        }
        .btn-primary {
            background: var(--caramel);
            color: var(--white);
        }
        .btn-primary:hover {
            background: #a5711f;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(196,134,42,0.4);
            text-decoration: none;
        }
        .btn-outline {
            background: transparent;
            color: var(--caramel);
            border: 2px solid var(--caramel);
        }
        .btn-outline:hover {
            background: var(--caramel);
            color: var(--white);
            text-decoration: none;
        }

        /* ===== Cards ===== */
        .card {
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px;
            transition: transform .2s ease, box-shadow .2s ease;
        }
        .card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-lg);
        }

        /* ===== Section heading ===== */
        .section-heading {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            color: var(--dark-roast);
            margin-bottom: 8px;
        }
        .section-sub {
            color: var(--text-muted);
            margin-bottom: 32px;
            font-size: 15px;
        }

        /* ===== Badge ===== */
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .badge-hot     { background: #fff0e6; color: #d4500a; }
        .badge-new     { background: #e8f5e9; color: #2e7d32; }
        .badge-limited { background: #fce4ec; color: #c62828; }

        /* ===== Grid utilities ===== */
        .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }

        @media (max-width: 900px) {
            .grid-3, .grid-4 { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 600px) {
            .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
            main { padding: 24px 20px; }
            nav.sidebar { display: none; }
        }
    </style>
</head>
<body>
    <header>{{template "header" .}}</header>
    <div class="page-body">
        <nav class="sidebar">{{template "sidebar" .}}</nav>
        <main>{{template "content" .}}</main>
    </div>
    <footer>{{template "footer" .}}</footer>
</body>
</html>
{{end}}
