{{define "content"}}
<style>
    .page-header { margin-bottom: 32px; }
    .page-header h1 {
        font-family: 'Playfair Display', serif;
        font-size: 32px;
        color: var(--dark-roast);
        margin-bottom: 6px;
    }
    .page-header p { color: var(--text-muted); }

    /* Promo grid */
    .promo-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 24px;
    }

    .promo-card {
        background: var(--white);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        overflow: hidden;
        transition: transform .2s, box-shadow .2s;
        display: flex;
        flex-direction: column;
    }
    .promo-card:hover {
        transform: translateY(-4px);
        box-shadow: var(--shadow-lg);
    }

    .promo-card-top {
        background: linear-gradient(135deg, var(--espresso) 0%, var(--dark-roast) 60%, var(--medium) 100%);
        padding: 28px 28px 20px;
        position: relative;
        overflow: hidden;
    }
    .promo-card-top::after {
        content: "🎁";
        position: absolute;
        right: 20px;
        bottom: -10px;
        font-size: 72px;
        opacity: 0.07;
    }

    .promo-badge-wrap { margin-bottom: 14px; }
    .promo-title {
        font-family: 'Playfair Display', serif;
        font-size: 20px;
        color: var(--cream);
        line-height: 1.3;
        margin-bottom: 8px;
    }
    .promo-desc {
        font-size: 13px;
        color: rgba(245,230,208,0.75);
        line-height: 1.6;
    }

    .promo-card-bottom {
        padding: 18px 28px 24px;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 14px;
    }

    .promo-code-wrap {
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .promo-code-label { font-size: 12px; color: var(--text-muted); font-weight: 500; }
    .promo-code {
        background: var(--milk);
        border: 1.5px dashed var(--caramel);
        color: var(--caramel);
        font-size: 13px;
        font-weight: 800;
        padding: 5px 14px;
        border-radius: 8px;
        letter-spacing: 1.5px;
        font-family: 'Inter', monospace;
    }
    .promo-copy-btn {
        background: none;
        border: none;
        cursor: pointer;
        font-size: 14px;
        opacity: 0.6;
        transition: opacity .15s;
    }
    .promo-copy-btn:hover { opacity: 1; }

    .promo-until {
        font-size: 12px;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        gap: 6px;
    }

    @media (max-width: 700px) { .promo-grid { grid-template-columns: 1fr; } }
</style>

<div class="page-header">
    <h1>🎁 Promo Spesial</h1>
    <p>Promo terbaru untuk pelanggan setia Kopiku — jangan sampai ketinggalan!</p>
</div>

<div class="promo-grid">
    {{range .Promos}}
    <div class="promo-card">
        <div class="promo-card-top">
            <div class="promo-badge-wrap">
                <span class="badge badge-{{.BadgeType}}">{{.Badge}}</span>
            </div>
            <div class="promo-title">{{.Title}}</div>
            <div class="promo-desc">{{.Desc}}</div>
        </div>
        <div class="promo-card-bottom">
            <div class="promo-code-wrap">
                <span class="promo-code-label">Kode Promo:</span>
                <span class="promo-code">{{.Code}}</span>
                <button class="promo-copy-btn" onclick="navigator.clipboard.writeText('{{.Code}}').then(()=>alert('Kode disalin!'))" title="Salin kode">📋</button>
            </div>
            <div class="promo-until">📅 Berlaku hingga: <strong>{{.Until}}</strong></div>
        </div>
    </div>
    {{end}}
</div>
{{end}}
