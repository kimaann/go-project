{{define "content"}}
<style>
    .page-header { margin-bottom: 32px; }
    .page-header h1 {
        font-family: 'Playfair Display', serif;
        font-size: 32px;
        color: var(--dark-roast);
        margin-bottom: 6px;
    }
    .page-header p { color: var(--text-muted); }

    /* Branch cards grid */
    .branch-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
    }

    .branch-card {
        background: var(--white);
        border-radius: var(--radius);
        padding: 24px;
        box-shadow: var(--shadow);
        border-top: 4px solid var(--caramel);
        transition: transform .2s, box-shadow .2s;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }
    .branch-card:hover {
        transform: translateY(-4px);
        box-shadow: var(--shadow-lg);
    }
    .branch-card-icon {
        font-size: 28px;
    }
    .branch-city {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--caramel);
    }
    .branch-name {
        font-family: 'Playfair Display', serif;
        font-size: 18px;
        color: var(--dark-roast);
        line-height: 1.3;
    }
    .branch-info {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 6px;
    }
    .branch-info li {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        font-size: 13px;
        color: var(--text-muted);
        line-height: 1.4;
    }
    .branch-info .info-icon { flex-shrink: 0; font-size: 14px; margin-top: 1px; }
    .branch-footer {
        margin-top: auto;
        padding-top: 12px;
        border-top: 1px solid var(--cream);
    }
    .branch-maps {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        font-weight: 600;
        color: var(--caramel);
        text-decoration: none;
        transition: opacity .15s;
    }
    .branch-maps:hover { opacity: 0.75; text-decoration: none; }

    @media (max-width: 900px) { .branch-grid { grid-template-columns: repeat(2,1fr); } }
    @media (max-width: 580px) { .branch-grid { grid-template-columns: 1fr; } }
</style>

<div class="page-header">
    <h1>📍 Cabang Kami</h1>
    <p>Temukan Kopiku terdekat di kotamu — 6 cabang aktif siap melayani</p>
</div>

<div class="branch-grid">
    {{range .Branches}}
    <div class="branch-card">
        <span class="branch-card-icon">☕</span>
        <div class="branch-city">{{.City}}</div>
        <div class="branch-name">{{.Name}}</div>
        <ul class="branch-info">
            <li>
                <span class="info-icon">🗺️</span>
                <span>{{.Address}}</span>
            </li>
            <li>
                <span class="info-icon">🕐</span>
                <span>{{.Hours}} WIB</span>
            </li>
            <li>
                <span class="info-icon">📞</span>
                <span>{{.Phone}}</span>
            </li>
        </ul>
        <div class="branch-footer">
            <a href="{{.Maps}}" class="branch-maps">📌 Lihat di Maps →</a>
        </div>
    </div>
    {{end}}
</div>
{{end}}
